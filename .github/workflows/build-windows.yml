name: build-windows

# Builds a standalone Windows orbit.exe from any branch, on a free Linux runner: the Windows Bun
# runtime is downloaded and embedded, so the result needs nothing installed on the machine that runs
# it. See docs/windows-build.md for the measurements behind the workspace sizes and the caveats.
#
# Manual only: the artifact is ~250 MB and nobody needs one by surprise.

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to build
        type: string
        default: dev
      release:
        description: Also attach the zip to a draft release
        type: boolean
        default: false

permissions:
  contents: write # only used by the release step; the build itself reads

concurrency:
  group: build-windows
  cancel-in-progress: false

jobs:
  windows:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ inputs.branch }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Install
        run: bun install --frozen-lockfile

      # One target, cross-compiled. The build downloads the matching Windows Bun runtime
      # (BUN_COMPILE_RELEASE) and installs the win32 helper packages itself.
      - name: Build the Windows CLI
        working-directory: packages/cli
        env:
          OPENCODE_TARGET: windows-x64
          BUN_COMPILE_RELEASE: bun-v1.4.4
          GH_TOKEN: ${{ github.token }}
        run: bun run build

      - name: Check the binary
        working-directory: packages/cli/dist/cli-windows-x64/bin
        run: |
          set -euo pipefail
          test -s orbit.exe
          file orbit.exe
          ls -l orbit.exe
          du -h orbit.exe
          sha256sum orbit.exe | tee "$GITHUB_WORKSPACE/SHA256SUMS.txt"

      - name: Upload the artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: orbit-windows-x64
          path: packages/cli/dist/cli-windows-x64/bin/orbit.exe
          if-no-files-found: error
          retention-days: 14

      # A release asset is a single zip with a stable URL; the artifact above is a zip that contains
      # the executable directly.
      - name: Draft release
        if: ${{ inputs.release }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd packages/cli/dist/cli-windows-x64/bin
          zip -9 "$GITHUB_WORKSPACE/orbit-windows-x64.zip" orbit.exe
          cd "$GITHUB_WORKSPACE"
          gh release create "windows-build-${GITHUB_RUN_NUMBER}" orbit-windows-x64.zip \
            --draft \
            --title "Orbit for Windows — build ${GITHUB_RUN_NUMBER}" \
            --notes "Built from ${GITHUB_SHA:0:7} on ${GITHUB_REF_NAME}. Unsigned: Windows shows SmartScreen once."
